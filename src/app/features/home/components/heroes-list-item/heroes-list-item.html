<mat-card appearance="outlined">
    <mat-card-content class="card-layout">
        <span appUppercase>{{name()}}</span>
        <div>
            <button mat-mini-fab (click)="onEdit()" elevation="0" aria-label="Edit Hero">
                <mat-icon>edit</mat-icon>
            </button>
            <button mat-mini-fab (click)="onDelete()" elevation="0" aria-label="Delete Hero">
                <mat-icon>delete</mat-icon>
            </button>
        </div>
    </mat-card-content>
</mat-card>
