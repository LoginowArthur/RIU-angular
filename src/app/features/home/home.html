<mat-form-field appearance="outline">
  <mat-label>Heroes</mat-label>
  <input 
    matInput 
    type="text" 
    [value]="searchTerm()" 
    (input)="onSearchChange($event)">
</mat-form-field>

<div class="list-container">
  @for (hero of paginatedHeroes(); track hero.id) {
    <heroes-list-item 
      [id]="hero.id" 
      [name]="hero.name"
      (edit)="onEdit($event)" 
      (delete)="onDelete(hero.id)">
    </heroes-list-item>
  }
</div>

<div class="list-footer">
    <button matButton="filled" type="button" (click)="onAdd()">Add hero</button>
    <mat-paginator
      [length]="heroes().length"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 15]"
      aria-label="Select page of heroes"
      (page)="handlePageEvent($event)">
    </mat-paginator>
</div>
