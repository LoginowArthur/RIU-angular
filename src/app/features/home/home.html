<mat-form-field appearance="outline">
    <mat-label>Heroes</mat-label>
    <input matInput type="text">
</mat-form-field>
<div class="list-container">
    @for (hero of heroes(); track hero.id) {
        <heroes-list-item 
            [id]="hero.id" 
            [name]="hero.name"
            (edit)="onEdit($event)" 
            (delete)="onDelete($event)">
        </heroes-list-item>
    }
</div>
